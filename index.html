<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A private interactive monthsary page with photos, a letter, and music.">
<meta name="theme-color" content="#ffd0dc">
<title>Happy 10th Monthsary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#ffd0dc;
    --bg-b:#fff1f4;
    --bg-c:#f7e8d8;
    --rose-deep:#c2185b;
    --rose-mid:#e8799a;
    --ink:#5c3048;
    --ink-soft:#8a5570;
    --card:#fffaf7;
    --card-edge:#f3e3e0;
    --gold:#ffd9a0;
    --stem:#5f8a4a;
    --stem-dark:#3f6632;
    --leaf:#6b9a55;
    --leaf-dark:#4e7a3c;
    --petal-1:#f4a8c4;
    --petal-2:#e878a8;
    --petal-3:#ffd6e4;
    --petal-core:#fff6f9;
    --wrap:#f3e4c8;
    --ribbon:#d45a86;
  }

  *{box-sizing:border-box;}
  :focus-visible{outline:2px solid var(--rose-deep);outline-offset:4px;}
  html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;}

  body{
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,182,193,.55), transparent 50%),
      radial-gradient(ellipse at 90% 10%, rgba(255,220,180,.4), transparent 45%),
      linear-gradient(165deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .visually-hidden-input,.sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  #particles,#petal-layer,#heart-layer{
    position:fixed;inset:0;width:100%;height:100%;pointer-events:none;
  }
  #particles{z-index:1;}
  #petal-layer{z-index:4;overflow:hidden;}
  #heart-layer{z-index:6;overflow:hidden;}

  .ambient-heart{
    position:absolute;bottom:-30px;font-size:14px;color:var(--rose-mid);
    opacity:.75;filter:drop-shadow(0 0 3px rgba(232,121,154,.5));
    will-change:transform,opacity;
    animation:floatUp var(--heart-duration,10s) cubic-bezier(.37,0,.23,1) forwards;
  }
  @keyframes floatUp{
    0%{transform:translate(0,0) rotate(0deg);opacity:0;}
    10%{opacity:.8;}
    90%{opacity:.55;}
    48%{transform:translate(calc(var(--drift,20px) * .38),-52vh) rotate(-8deg);opacity:.7;}
    100%{transform:translate(var(--drift,20px),-110vh) rotate(22deg);opacity:0;}
  }

  .burst-heart,.fall-petal{
    position:absolute;pointer-events:none;
  }
  .burst-heart{
    font-size:16px;color:var(--rose-deep);
    will-change:transform,opacity;
    animation:burst 850ms cubic-bezier(.16,.84,.28,1) forwards;
    filter:drop-shadow(0 0 4px rgba(194,24,91,.45));
  }
  @keyframes burst{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:1;}
    100%{transform:translate(calc(-50% + var(--bx,0px)), calc(-50% + var(--by,0px))) scale(1.1);opacity:0;}
  }
  .fall-petal{
    width:18px;height:28px;
    background:
      radial-gradient(ellipse at 40% 30%, #fff6f9 0%, #f4a8c4 45%, #e878a8 100%);
    border-radius:60% 60% 55% 55% / 30% 30% 70% 70%;
    will-change:transform,opacity;
    animation:petalFall var(--fall-duration,5.5s) cubic-bezier(.37,0,.28,1) forwards;
    filter:drop-shadow(0 2px 3px rgba(194,24,91,.25));
  }
  @keyframes petalFall{
    0%{transform:translateY(-8vh) rotate(0deg);opacity:0;}
    8%{opacity:.92;}
    28%{transform:translate(var(--drift-a,-8px),28vh) rotate(var(--spin-a,70deg));}
    54%{transform:translate(var(--drift-b,22px),57vh) rotate(var(--spin-b,156deg));opacity:.86;}
    78%{transform:translate(var(--drift-c,38px),84vh) rotate(var(--spin-c,224deg));opacity:.58;}
    100%{transform:translate(var(--drift,40px),112vh) rotate(var(--spin,280deg));opacity:0;}
  }

  .tulip-corner{
    position:fixed;bottom:-8px;width:min(42vw,300px);height:min(42vw,300px);
    pointer-events:none;z-index:2;
  }
  .tulip-corner.left{left:-14px;}
  .tulip-corner.right{right:-14px;transform:scaleX(-1);}
  .sway{transform-origin:50% 100%;will-change:transform;animation:sway 6.8s cubic-bezier(.45,.05,.55,.95) infinite;}
  .sway.b{animation-duration:7.8s;animation-delay:-1.4s;}
  .sway.c{animation-duration:5.9s;animation-delay:-2.8s;}
  @keyframes sway{
    0%,100%{transform:rotate(-2.4deg);}
    50%{transform:rotate(2.8deg);}
  }

  .toolbar{
    position:fixed;top:max(14px, env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));z-index:12;
    display:flex;gap:8px;
  }
  .icon-btn{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(194,24,91,.28);
    background:rgba(255,250,247,.86);
    color:var(--rose-deep);cursor:pointer;
    display:grid;place-items:center;
    box-shadow:0 6px 16px rgba(139,58,80,.14);
    backdrop-filter:blur(8px);
    transition:transform 180ms ease, background 180ms ease;
  }
  .icon-btn:hover{transform:translateY(-2px);background:#fff;}
  .icon-btn[aria-pressed="true"]{background:#ffe4ec;}

  main{
    position:relative;z-index:3;width:100%;max-width:960px;
    padding:7vh 24px 14vh;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }

  .fade-in{opacity:0;transform:translate3d(0,22px,0) scale(.985);will-change:transform,opacity;transition:opacity 800ms cubic-bezier(.22,1,.36,1), transform 950ms cubic-bezier(.22,1,.36,1);}
  .fade-in.visible{opacity:1;transform:none;}
  #hero-badge{transition-delay:40ms;}
  .badge-label{transition-delay:100ms;}
  #hero-title{transition-delay:150ms;}
  #together-line{transition-delay:200ms;}
  #days-line{transition-delay:250ms;}
  #bouquet{transition-delay:320ms;}
  .letter{transition-delay:390ms;}

  .badge{
    width:82px;height:82px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--petal-3) 55%, var(--petal-1) 100%);
    border:1.5px solid rgba(194,24,91,.35);
    display:flex;align-items:center;justify-content:center;
    font-style:italic;font-weight:600;font-size:1.95rem;color:var(--rose-deep);
    box-shadow:0 4px 18px rgba(194,24,91,.18);
    will-change:transform;
    animation:heartbeat 2.8s cubic-bezier(.45,.05,.55,.95) infinite;
    margin-bottom:10px;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.055);}
    24%{transform:scale(1);}
  }
  .badge-label{
    font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--rose-deep);margin-bottom:18px;opacity:.75;
  }
  h1{
    font-family:'Dancing Script', cursive;font-weight:700;
    font-size:clamp(2.5rem, 7vw, 4.8rem);margin:0 0 10px;
    color:var(--rose-deep);line-height:1.05;
    text-shadow:0 0 18px rgba(232,121,154,.5);
    animation:glow 4.8s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{text-shadow:0 0 16px rgba(232,121,154,.4);}
    50%{text-shadow:0 0 28px rgba(232,121,154,.75);}
  }
  .together-line{
    font-size:clamp(1.05rem, 2.4vw, 1.3rem);font-style:italic;
    color:var(--ink-soft);margin:0 0 8px;
  }
  .days-line{
    font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--rose-deep);opacity:.7;margin:0 0 28px;
  }

  .bouquet-stage{
    width:min(100%, 420px);margin:0 auto 42px;cursor:pointer;
    position:relative;border:0;background:transparent;padding:0;
  }
  .bouquet-stage:focus-visible{outline:2px solid var(--rose-deep);outline-offset:6px;border-radius:20px;}
  .bouquet-symbol{
    width:100%;min-height:210px;border-radius:28px 28px 70px 70px;
    display:grid;place-items:center;
    color:var(--rose-deep);font-size:clamp(4.8rem,18vw,7.2rem);letter-spacing:.04em;
    background:radial-gradient(circle at 50% 35%,#fff 0%,#ffeaf0 35%,#f7d5df 100%);
    box-shadow:0 18px 42px rgba(139,58,80,.16),0 2px 0 rgba(255,255,255,.7) inset;
    transition:transform 700ms cubic-bezier(.22,1,.36,1),box-shadow 700ms ease;
  }
  .bouquet-stage:hover .bouquet-symbol,.bouquet-stage:focus-visible .bouquet-symbol{transform:translate3d(0,-4px,0) scale(1.015);box-shadow:0 25px 50px rgba(139,58,80,.23);}
  .bouquet-hint{
    margin-top:10px;font-style:italic;font-size:.95rem;color:var(--ink-soft);opacity:.75;
  }

  .letter{
    width:100%;max-width:560px;
    background:linear-gradient(180deg, #fffdf9, #fff4f0);
    border:1px solid var(--card-edge);
    border-radius:18px;
    padding:28px 28px 22px;
    box-shadow:0 14px 36px rgba(139,58,80,.14);
    margin-bottom:48px;
    text-align:left;
  }
  .letter h2{
    font-family:'Dancing Script', cursive;font-size:1.8rem;margin:0 0 10px;color:var(--rose-deep);
    text-align:center;
  }
  .letter-body{
    font-size:1.12rem;line-height:1.7;min-height:4.5em;outline:none;
  }
  .letter-body:empty:before{content:attr(data-placeholder);color:rgba(107,53,80,.4);font-style:italic;}
  .signoff{
    font-family:'Dancing Script', cursive;font-size:1.35rem;text-align:right;margin-top:12px;outline:none;
  }
  .signoff:empty:before{content:attr(data-placeholder);color:rgba(107,53,80,.4);}

  .gallery{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:34px 26px;width:100%;max-width:820px;
  }
  .polaroid{
    background:var(--card);border:1px solid var(--card-edge);border-radius:10px;
    padding:14px 14px 16px;
    box-shadow:0 10px 26px rgba(139,58,80,.18);
    transition:transform 320ms ease, box-shadow 320ms ease;
    display:flex;flex-direction:column;align-items:center;position:relative;
  }
  .polaroid:hover{transform:translateY(-6px) rotate(0) scale(1.02);box-shadow:0 18px 34px rgba(139,58,80,.24);}
  .photo-slot{
    width:100%;aspect-ratio:1;border-radius:6px;
    border:1.5px dashed rgba(194,24,91,.35);
    background:linear-gradient(160deg,#fff,#fff3f5);background-size:cover;background-position:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;text-align:center;padding:10px;
  }
  .photo-slot.drag-over{border-color:var(--rose-deep);background-color:#ffeef2;}
  .photo-slot.filled{border-style:solid;border-color:var(--card-edge);}
  .photo-slot.filled .slot-placeholder{display:none;}
  .slot-placeholder{color:var(--rose-mid);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;}
  .slot-placeholder svg{width:30px;height:30px;opacity:.75;}
  .slot-placeholder span{font-size:.85rem;font-style:italic;max-width:120px;}
  .caption{
    margin-top:12px;font-family:'Dancing Script', cursive;font-size:1.25rem;
    color:var(--ink);outline:none;min-width:60px;text-align:center;width:100%;
  }
  .caption:empty:before{content:attr(data-placeholder);color:rgba(107,53,80,.45);}
  .remove-card{
    position:absolute;top:6px;right:8px;border:0;background:transparent;
    color:var(--rose-mid);cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity 160ms;
  }
  .polaroid:hover .remove-card,.polaroid:focus-within .remove-card{opacity:1;}
  .polaroid.add-card{
    background:transparent;border:1.5px dashed rgba(194,24,91,.4);box-shadow:none;
    justify-content:center;cursor:pointer;color:var(--rose-deep);min-height:220px;
  }
  .polaroid.add-card:hover{background:rgba(255,255,255,.4);}
  .add-icon{font-size:2rem;line-height:1;margin-bottom:6px;}

  footer{position:relative;z-index:3;padding:0 24px 36px;font-style:italic;color:var(--ink-soft);opacity:.8;text-align:center;}

  .gate{
    position:fixed;inset:0;z-index:20;
    background:linear-gradient(165deg,#ffb6c8,#ffe8ee 55%,#f7e4d4);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity 700ms cubic-bezier(.22,1,.36,1), visibility 700ms ease;
  }
  .gate.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .envelope{
    width:min(78vw,280px);height:180px;position:relative;cursor:pointer;
    filter:drop-shadow(0 16px 24px rgba(139,58,80,.25));border:0;background:transparent;padding:0;
  }
  .envelope .flap,.envelope .pocket{
    position:absolute;inset:0;border-radius:8px;
  }
  .envelope .pocket{
    background:linear-gradient(180deg,#fff7f4,#f8dce4);
    border:1px solid rgba(194,24,91,.25);
  }
  .envelope .flap{
    height:58%;clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(180deg,#ffd0dc,#f4a8c4);
    transform-origin:top center;will-change:transform;transition:transform 760ms cubic-bezier(.22,1,.36,1);
  }
  .envelope.open .flap{transform:rotateX(180deg);}
  .gate p{font-family:'Dancing Script',cursive;font-size:1.7rem;color:var(--rose-deep);margin:0;}
  .gate button.seal{
    border:0;border-radius:999px;padding:10px 22px;cursor:pointer;
    background:var(--rose-deep);color:#fff;font-family:inherit;font-size:1rem;
  }

  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(92vw,360px);z-index:16;
    background:#fffaf7;border-left:1px solid var(--card-edge);
    box-shadow:-12px 0 32px rgba(90,40,60,.16);
    padding:72px 22px 24px;transform:translateX(100%);transition:transform 280ms ease;
  }
  .drawer.open{transform:none;}
  .drawer h3{font-family:'Dancing Script',cursive;font-size:1.7rem;margin:0 0 16px;color:var(--rose-deep);}
  .drawer label{display:block;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin:12px 0 6px;color:var(--ink-soft);}
  .drawer input{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--card-edge);
    font-family:inherit;font-size:1rem;background:#fff;
  }
  .drawer .hint{font-size:.85rem;color:var(--ink-soft);margin-top:16px;line-height:1.5;}

  .lightbox{
    position:fixed;inset:0;z-index:18;background:rgba(60,20,36,.72);
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:min(92vw,820px);max-height:86vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .lightbox-close{
    position:absolute;top:max(16px, env(safe-area-inset-top));right:max(16px, env(safe-area-inset-right));
    width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:var(--rose-deep);
    cursor:pointer;font-size:1.7rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }

  @media (max-width:520px){
    .tulip-corner{width:min(58vw,220px);height:min(58vw,220px);}
    .gallery{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:22px 16px;}
    main{padding:8vh 16px 14vh;}
    .letter{padding:20px 16px;}
  }
  @media (prefers-reduced-motion:reduce){
    .sway,h1,.badge,.ambient-heart,.burst-heart,.fall-petal,.fade-in{animation:none !important;transition:none !important;}
    .fade-in{opacity:1;transform:none;}
    .bouquet-symbol{transition:none;}
  }
  @media print{
    .toolbar,.gate,.drawer,#particles,#heart-layer,#petal-layer,.tulip-corner,footer,.bouquet-hint,.icon-btn{display:none !important;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<!-- External Background Music -->
<audio id="bg-music" loop preload="metadata">
  <source src="./assets/audio/coffee-by-miguel.mp3" type="audio/mpeg">
</audio>
<p class="sr-only" id="music-status" aria-live="polite"></p>

<canvas id="particles" aria-hidden="true"></canvas>
<div id="petal-layer" aria-hidden="true"></div>
<div id="heart-layer" aria-hidden="true"></div>

<div class="toolbar">
  <button class="icon-btn" id="music-btn" type="button" aria-controls="bg-music" aria-pressed="false" title="Play our song" aria-label="Toggle music">♪</button>
  <button class="icon-btn" id="petal-btn" type="button" title="Let petals fall" aria-label="Falling petals">❀</button>
  <button class="icon-btn" id="settings-btn" type="button" aria-controls="drawer" aria-expanded="false" title="Customize" aria-label="Open settings">✎</button>
  <button class="icon-btn" id="capture-btn" type="button" title="Capture whole page" aria-label="Capture whole page">▣</button>
</div>

<!-- Accurate botanical tulips used in the corners (6 tepals, cup form, lanceolate leaves) -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="petalA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fff6f8"/>
      <stop offset="28%" stop-color="#f7b3cc"/>
      <stop offset="72%" stop-color="#ea7aa8"/>
      <stop offset="100%" stop-color="#d45a86"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe4ee"/>
      <stop offset="55%" stop-color="#f09ab8"/>
      <stop offset="100%" stop-color="#c94e7c"/>
    </linearGradient>
    <linearGradient id="petalC" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="60%" stop-color="#f4a8c4"/>
      <stop offset="100%" stop-color="#e0709a"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fc978"/>
      <stop offset="55%" stop-color="#5f8a4a"/>
      <stop offset="100%" stop-color="#3f6632"/>
    </linearGradient>
    <g id="tulip-bloom">
      <path d="M0 52 C-10 46 -18 28 -16 10 C-14 -8 -6 -22 0 -28 C4 -18 8 -4 7 16 C5 36 4 48 0 52Z" fill="url(#petalB)"/>
      <path d="M0 52 C10 46 18 28 16 10 C14 -8 6 -22 0 -28 C-4 -18 -8 -4 -7 16 C-5 36 -4 48 0 52Z" fill="url(#petalC)"/>
      <path d="M0 54 C-22 40 -24 12 -8 -18 C-3 -28 3 -28 8 -18 C24 12 22 40 0 54Z" fill="url(#petalA)"/>
      <path d="M-2 50 C-20 34 -18 8 -6 -14 C-12 8 -12 32 -2 50Z" fill="#e0709a" opacity=".35"/>
      <path d="M2 50 C20 34 18 8 6 -14 C12 8 12 32 2 50Z" fill="#fff6f8" opacity=".28"/>
      <ellipse cx="0" cy="46" rx="7" ry="5" fill="#3f6632" opacity=".55"/>
    </g>
    <g id="tulip-bud">
      <path d="M0 36 C-12 28 -14 8 -4 -16 C-1 -24 1 -24 4 -16 C14 8 12 28 0 36Z" fill="url(#petalA)"/>
      <path d="M-3 32 C-11 22 -10 6 -3 -8 C-7 8 -7 22 -3 32Z" fill="#c94e7c" opacity=".35"/>
      <ellipse cx="0" cy="34" rx="5" ry="4" fill="#3f6632"/>
    </g>
  </defs>
</svg>

<div class="tulip-corner left" aria-hidden="true">
  <svg viewBox="0 0 280 300">
    <g class="sway a">
      <path d="M70 300 C62 210 78 150 88 108" stroke="#3f6632" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <path d="M86 200 C18 188 -6 230 8 268 C48 250 78 228 88 208Z" fill="url(#leafG)"/>
      <g transform="translate(88 100) scale(1.05)"><use href="#tulip-bloom"/></g>
    </g>
    <g class="sway b">
      <path d="M118 300 C122 220 128 160 134 122" stroke="#3f6632" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M132 210 C186 198 214 236 208 270 C168 252 140 232 132 216Z" fill="url(#leafG)"/>
      <g transform="translate(134 116) rotate(8) scale(.92)"><use href="#tulip-bloom"/></g>
    </g>
    <g class="sway c">
      <path d="M46 300 C50 240 54 190 58 156" stroke="#3f6632" stroke-width="3.8" fill="none" stroke-linecap="round"/>
      <g transform="translate(58 150) rotate(-10) scale(.78)"><use href="#tulip-bud"/></g>
    </g>
  </svg>
</div>
<div class="tulip-corner right" aria-hidden="true">
  <svg viewBox="0 0 280 300">
    <g class="sway a">
      <path d="M70 300 C62 210 78 150 88 108" stroke="#3f6632" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <path d="M86 200 C18 188 -6 230 8 268 C48 250 78 228 88 208Z" fill="url(#leafG)"/>
      <g transform="translate(88 100) scale(1.05)"><use href="#tulip-bloom"/></g>
    </g>
    <g class="sway b">
      <path d="M118 300 C122 220 128 160 134 122" stroke="#3f6632" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <g transform="translate(134 116) rotate(8) scale(.92)"><use href="#tulip-bloom"/></g>
    </g>
    <g class="sway c">
      <path d="M46 300 C50 240 54 190 58 156" stroke="#3f6632" stroke-width="3.8" fill="none" stroke-linecap="round"/>
      <g transform="translate(58 150) rotate(-10) scale(.78)"><use href="#tulip-bud"/></g>
    </g>
  </svg>
</div>

<main>
  <div class="badge fade-in" id="hero-badge">10</div>
  <span class="badge-label fade-in">months together</span>
  <h1 class="fade-in" id="hero-title">Happy 10th Monthsary</h1>
  <p class="together-line fade-in" id="together-line">for us</p>
  <p class="days-line fade-in" id="days-line"></p>

  <button class="bouquet-stage fade-in no-burst" id="bouquet" type="button" aria-label="Pink tulip bouquet. Click to send petals.">
    <div class="bouquet-symbol" role="img" aria-label="Pink tulips">🌷🌷🌷</div>
    <p class="bouquet-hint">three tulips for us — tap to let petals fall</p>
  </button>

  <article class="letter fade-in no-burst">
    <h2>a little letter</h2>
    <div class="letter-body" id="letter-body" contenteditable="true" data-placeholder="Write something only the two of you would understand…" role="textbox" aria-multiline="true" aria-label="Love letter"></div>
    <div class="signoff" id="letter-sign" contenteditable="true" data-placeholder="with love" role="textbox" aria-label="Sign-off"></div>
  </article>

  <section class="gallery" id="gallery" aria-label="Photo memories"></section>
</main>

<footer>tap anywhere to send a little love · photos and words stay on this device</footer>

<div class="gate" id="gate">
  <button class="envelope no-burst" id="envelope" type="button" aria-label="Open the envelope">
    <div class="pocket"></div>
    <div class="flap"></div>
  </button>
  <p>for you</p>
  <button class="seal no-burst" id="open-gate" type="button">open with love</button>
</div>

<aside class="drawer no-burst" id="drawer" aria-label="Customize this page" aria-hidden="true" inert>
  <h3>make it yours</h3>
  <label for="name-a">Your name</label>
  <input id="name-a" type="text" maxlength="40" autocomplete="name">
  <label for="name-b">Their name</label>
  <input id="name-b" type="text" maxlength="40">
  <label for="start-date">Together since</label>
  <input id="start-date" type="date">
  <p class="hint">The month count updates from this date. Captions, the letter, and photos are saved in this browser only.</p>
</aside>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true" tabindex="-1">
  <button class="lightbox-close" id="close-lightbox" type="button" aria-label="Close photo">×</button>
  <img id="lightbox-img" alt="Memory">
</div>

<script src="./assets/html2canvas.min.js"></script>
<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STORAGE = 'monthsary-v2';

  function loadState(){
    try{ return JSON.parse(localStorage.getItem(STORAGE) || '{}'); }catch(e){ return {}; }
  }
  function saveState(partial){
    var s = loadState();
    for (var k in partial) s[k] = partial[k];
    try{ localStorage.setItem(STORAGE, JSON.stringify(s)); }catch(e){}
  }

  var state = loadState();
  var nameA = document.getElementById('name-a');
  var nameB = document.getElementById('name-b');
  var startDate = document.getElementById('start-date');
  nameA.value = state.nameA || '';
  nameB.value = state.nameB || '';
  startDate.value = state.startDate || '';

  function monthsBetween(from){
    var a = new Date(from + 'T00:00:00');
    var b = new Date();
    if (isNaN(a.getTime())) return 10;
    var m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    if (b.getDate() < a.getDate()) m -= 1;
    return Math.max(0, m);
  }
  function daysBetween(from){
    var a = new Date(from + 'T00:00:00');
    var b = new Date();
    if (isNaN(a.getTime())) return null;
    return Math.max(0, Math.floor((b - a) / 86400000));
  }
  function ordinal(n){
    var s = ['th','st','nd','rd'];
    var v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function refreshHero(){
    var months = startDate.value ? monthsBetween(startDate.value) : 10;
    document.getElementById('hero-badge').textContent = String(months);
    document.getElementById('hero-title').textContent = 'Happy ' + ordinal(months) + ' Monthsary';
    document.title = 'Happy ' + ordinal(months) + ' Monthsary';
    var a = (nameA.value || '').trim();
    var b = (nameB.value || '').trim();
    var line = document.getElementById('together-line');
    if (a && b) line.textContent = a + '  ♡  ' + b;
    else if (a || b) line.textContent = 'for ' + (a || b);
    else line.textContent = 'ten months, a thousand tiny moments';
    var days = startDate.value ? daysBetween(startDate.value) : null;
    document.getElementById('days-line').textContent = days != null ? (days + ' days of choosing each other') : '';
  }
  ['input','change'].forEach(function(evt){
    [nameA, nameB, startDate].forEach(function(el){
      el.addEventListener(evt, function(){
        saveState({ nameA: nameA.value, nameB: nameB.value, startDate: startDate.value });
        refreshHero();
      });
    });
  });
  refreshHero();

  var letterBody = document.getElementById('letter-body');
  var letterSign = document.getElementById('letter-sign');
  letterBody.textContent = state.letter || '';
  letterSign.textContent = state.sign || '';
  function persistLetter(){
    saveState({ letter: letterBody.textContent, sign: letterSign.textContent });
  }
  letterBody.addEventListener('blur', persistLetter);
  letterSign.addEventListener('blur', persistLetter);

  document.querySelectorAll('.fade-in').forEach(function(el){
    el.classList.add('visible');
  });

  /* envelope gate */
  var gate = document.getElementById('gate');
  var envelope = document.getElementById('envelope');
  function openGate(){
    envelope.classList.add('open');
    setTimeout(function(){ gate.classList.add('hidden'); rainPetals(18); }, reduceMotion ? 0 : 520);
  }
  document.getElementById('open-gate').addEventListener('click', openGate);
  envelope.addEventListener('click', openGate);

  /* settings */
  var drawer = document.getElementById('drawer');
  var settingsBtn = document.getElementById('settings-btn');
  function setDrawer(open){
    drawer.classList.toggle('open', open);
    drawer.setAttribute('aria-hidden', String(!open));
    settingsBtn.setAttribute('aria-expanded', String(open));
    if ('inert' in drawer) drawer.inert = !open;
    else drawer.querySelectorAll('input, button, select, textarea, a[href]').forEach(function(el){ el.tabIndex = open ? 0 : -1; });
    if (open) nameA.focus();
  }
  setDrawer(false);
  settingsBtn.addEventListener('click', function(){
    setDrawer(!drawer.classList.contains('open'));
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('#drawer') && !e.target.closest('#settings-btn') && drawer.classList.contains('open')) setDrawer(false);
  });

  /* petals */
  var petalLayer = document.getElementById('petal-layer');
  function rainPetals(n){
    if (reduceMotion) return;
    n = n || 14;
    for (var i = 0; i < n; i++){
      var p = document.createElement('div');
      p.className = 'fall-petal';
      p.style.left = Math.random() * 100 + 'vw';
      var drift = Math.random() * 120 - 60;
      var spin = 180 + Math.random() * 280;
      p.style.setProperty('--drift', drift + 'px');
      p.style.setProperty('--drift-a', (drift * -0.16).toFixed(1) + 'px');
      p.style.setProperty('--drift-b', (drift * 0.42).toFixed(1) + 'px');
      p.style.setProperty('--drift-c', (drift * 0.72).toFixed(1) + 'px');
      p.style.setProperty('--spin', spin + 'deg');
      p.style.setProperty('--spin-a', (spin * 0.25).toFixed(0) + 'deg');
      p.style.setProperty('--spin-b', (spin * 0.56).toFixed(0) + 'deg');
      p.style.setProperty('--spin-c', (spin * 0.8).toFixed(0) + 'deg');
      p.style.setProperty('--fall-duration', (4.8 + Math.random() * 2.8).toFixed(2) + 's');
      p.style.animationDelay = (Math.random() * 0.8).toFixed(2) + 's';
      p.style.width = (14 + Math.random() * 10) + 'px';
      p.style.height = (22 + Math.random() * 12) + 'px';
      petalLayer.appendChild(p);
      (function(el){ setTimeout(function(){ el.remove(); }, 9000); })(p);
    }
  }
  document.getElementById('bouquet').addEventListener('click', function(){ rainPetals(16); });
  document.getElementById('petal-btn').addEventListener('click', function(){ rainPetals(22); });

  /* gallery */
  var gallery = document.getElementById('gallery');
  var rotations = [-5, 4, -3, 6];
  var placeholders = ['our moment', 'that day', 'us, always', 'a little memory'];
  var uid = 0;
  var placeholderIcon =
    '<svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5C4 7.67 4.67 7 5.5 7H8l1.2-1.6C9.5 5.1 9.9 5 10.3 5h3.4c.4 0 .8.1 1.1.4L16 7h2.5C19.33 7 20 7.67 20 8.5v9c0 .83-.67 1.5-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5v-9Z" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.4"/></svg>';

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var closeLightboxBtn = document.getElementById('close-lightbox');
  var lastLightboxFocus = null;
  function openLightbox(src, caption){
    lastLightboxFocus = document.activeElement;
    lightboxImg.src = src;
    lightboxImg.alt = caption ? 'Memory: ' + caption : 'Memory photo';
    lightbox.classList.add('show');
    lightbox.setAttribute('aria-hidden', 'false');
    closeLightboxBtn.focus();
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lightbox.setAttribute('aria-hidden', 'true');
    if (lastLightboxFocus && typeof lastLightboxFocus.focus === 'function') lastLightboxFocus.focus();
  }
  closeLightboxBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (lightbox.classList.contains('show')) closeLightbox();
    else if (drawer.classList.contains('open')) { setDrawer(false); settingsBtn.focus(); }
  });

  function persistGallery(){
    var cards = [];
    gallery.querySelectorAll('.polaroid:not(.add-card)').forEach(function(card){
      var slot = card.querySelector('.photo-slot');
      var cap = card.querySelector('.caption');
      var bg = slot.style.backgroundImage || '';
      var m = bg.match(/url\(["']?(.*?)["']?\)/);
      cards.push({ src: m ? m[1] : '', caption: cap.textContent, rot: card.dataset.rot });
    });
    try{ saveState({ cards: cards }); }catch(e){}
  }

  function createPolaroid(rotate, placeholderText, saved){
    uid++;
    var wrap = document.createElement('div');
    wrap.className = 'polaroid fade-in visible no-burst';
    wrap.dataset.rot = String(rotate);
    wrap.style.transform = 'rotate(' + rotate + 'deg)';
    var inputId = 'photo-input-' + uid;
    var slot = document.createElement('label');
    slot.className = 'photo-slot';
    slot.setAttribute('for', inputId);
    var ph = document.createElement('div');
    ph.className = 'slot-placeholder';
    ph.innerHTML = placeholderIcon + '<span>click or drop a photo</span>';
    slot.appendChild(ph);
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.id = inputId; input.className = 'visually-hidden-input';
    slot.appendChild(input);
    var caption = document.createElement('div');
    caption.className = 'caption';
    caption.contentEditable = 'true';
    caption.setAttribute('data-placeholder', placeholderText || 'write a caption');
    caption.setAttribute('aria-label', 'Photo caption');
    if (saved && saved.caption) caption.textContent = saved.caption;
    var remove = document.createElement('button');
    remove.type = 'button'; remove.className = 'remove-card'; remove.setAttribute('aria-label', 'Remove memory');
    remove.textContent = '×';
    wrap.appendChild(remove); wrap.appendChild(slot); wrap.appendChild(caption);

    function setImage(src){
      slot.style.backgroundImage = 'url(' + src + ')';
      slot.classList.add('filled');
      persistGallery();
    }
    function loadFile(file){
      if (!file || (file.type && file.type.indexOf('image/') !== 0)) return;
      var reader = new FileReader();
      reader.onload = function(e){ setImage(e.target.result); };
      reader.readAsDataURL(file);
    }
    if (saved && saved.src) setImage(saved.src);
    input.addEventListener('change', function(){ if (input.files && input.files[0]) loadFile(input.files[0]); });
    caption.addEventListener('blur', persistGallery);
    remove.addEventListener('click', function(e){ e.preventDefault(); wrap.remove(); persistGallery(); });
    slot.addEventListener('dblclick', function(){
      if (!slot.classList.contains('filled')) return;
      var bg = slot.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/);
      if (bg){ openLightbox(bg[1], caption.textContent); }
    });
    ['dragenter','dragover'].forEach(function(evt){
      slot.addEventListener(evt, function(e){ e.preventDefault(); e.stopPropagation(); slot.classList.add('drag-over'); });
    });
    ['dragleave','drop'].forEach(function(evt){
      slot.addEventListener(evt, function(e){ e.preventDefault(); e.stopPropagation(); slot.classList.remove('drag-over'); });
    });
    slot.addEventListener('drop', function(e){
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) loadFile(file);
    });
    return wrap;
  }

  var addCard = document.createElement('div');
  addCard.className = 'polaroid add-card no-burst';
  addCard.tabIndex = 0;
  addCard.setAttribute('role', 'button');
  addCard.setAttribute('aria-label', 'Add another memory');
  addCard.innerHTML = '<span class="add-icon">+</span><span>add another memory</span>';
  function addNewCard(saved, rot){
    var r = rot != null ? parseFloat(rot) : parseFloat((Math.random() * 10 - 5).toFixed(1));
    var card = createPolaroid(r, saved && saved.caption ? 'a new memory' : 'a new memory', saved);
    gallery.insertBefore(card, addCard);
  }
  addCard.addEventListener('click', function(){ addNewCard(); persistGallery(); });
  addCard.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); addNewCard(); persistGallery(); }
  });

  gallery.appendChild(addCard);
  if (state.cards && state.cards.length){
    state.cards.forEach(function(c){ addNewCard(c, c.rot); });
  } else {
    rotations.forEach(function(rot, i){ gallery.appendChild(createPolaroid(rot, placeholders[i])); });
  }

  /* glitter */
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  for (var i = 0; i < 55; i++){
    particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: .8+Math.random()*2, speed: .12+Math.random()*.3, phase: Math.random()*Math.PI*2, gold: Math.random()>.55 });
  }
  function drawParticles(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (var i=0;i<particles.length;i++){
      var p = particles[i];
      p.y -= p.speed; p.x += Math.sin(t*0.0006 + p.phase)*0.15;
      if (p.y < -6){ p.y = canvas.height+6; p.x = Math.random()*canvas.width; }
      var tw = 0.25 + 0.65*Math.abs(Math.sin(t*0.0016 + p.phase));
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.gold ? 'rgba(255,217,160,'+tw.toFixed(2)+')' : 'rgba(255,255,255,'+tw.toFixed(2)+')';
      ctx.fill();
    }
  }
  function loop(t){ drawParticles(t||0); if(!reduceMotion) requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  var heartLayer = document.getElementById('heart-layer');
  function spawnAmbientHeart(){
    var h = document.createElement('div');
    h.className = 'ambient-heart'; h.textContent = '♥';
    h.style.left = Math.random()*100 + 'vw';
    h.style.setProperty('--drift', (Math.random()*80-40)+'px');
    h.style.animationDuration = (7+Math.random()*6).toFixed(1)+'s';
    h.style.fontSize = (10+Math.random()*10).toFixed(0)+'px';
    heartLayer.appendChild(h);
    setTimeout(function(){ h.remove(); }, 14000);
  }
  if (!reduceMotion){ setInterval(spawnAmbientHeart, 1400); spawnAmbientHeart(); }

  document.addEventListener('click', function(e){
    if (e.target.closest('.no-burst') || e.target.closest('footer') || e.target.closest('.gate') || e.target.closest('.toolbar') || e.target.closest('.lightbox')) return;
    for (var i=0;i<7;i++){
      var heart = document.createElement('div');
      heart.className = 'burst-heart'; heart.textContent = '♥';
      var angle = (Math.PI*2*i)/7 + Math.random()*0.4;
      var dist = 40 + Math.random()*50;
      heart.style.left = e.clientX+'px'; heart.style.top = e.clientY+'px';
      heart.style.setProperty('--bx', Math.cos(angle)*dist+'px');
      heart.style.setProperty('--by', Math.sin(angle)*dist-20+'px');
      heart.style.fontSize = (12+Math.random()*10).toFixed(0)+'px';
      heartLayer.appendChild(heart);
      (function(el){ setTimeout(function(){ el.remove(); }, 950); })(heart);
    }
  });

  /* whole-page capture */
  var captureBtn = document.getElementById('capture-btn');
  captureBtn.addEventListener('click', async function(){
    if (typeof window.html2canvas !== 'function') {
      alert('The capture tool is unavailable. Please check your internet connection and try again.');
      return;
    }

    var originalTitle = document.title;
    var hidden = [];
    var selectors = ['.toolbar', '.gate', '.drawer', '.lightbox'];

    selectors.forEach(function(selector){
      document.querySelectorAll(selector).forEach(function(el){
        hidden.push({ el: el, display: el.style.display });
        el.style.display = 'none';
      });
    });

    document.body.classList.add('capturing-page');
    captureBtn.disabled = true;
    captureBtn.setAttribute('aria-label', 'Capturing page');
    document.title = 'Capturing…';

    try {
      var width = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth, document.documentElement.clientWidth);
      var height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      var canvas = await window.html2canvas(document.body, {
        backgroundColor: null,
        useCORS: true,
        allowTaint: false,
        scale: Math.min(2, window.devicePixelRatio || 1),
        width: width,
        height: height,
        windowWidth: width,
        windowHeight: height,
        scrollX: 0,
        scrollY: 0,
        x: 0,
        y: 0,
        imageTimeout: 15000
      });

      var link = document.createElement('a');
      var date = new Date().toISOString().slice(0, 10);
      link.download = 'monthsary-page-' + date + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      console.error('Page capture failed:', err);
      alert('Could not capture the page. Please try again.');
    } finally {
      hidden.forEach(function(item){ item.el.style.display = item.display; });
      document.body.classList.remove('capturing-page');
      captureBtn.disabled = false;
      captureBtn.setAttribute('aria-label', 'Capture whole page');
      document.title = originalTitle;
    }
  });

  /* MP3 audio playback controls */
  var bgMusic = document.getElementById('bg-music');
  var musicBtn = document.getElementById('music-btn');
  var musicStatus = document.getElementById('music-status');

  function setMusicState(playing){
    musicBtn.setAttribute('aria-pressed', String(playing));
    musicBtn.textContent = playing ? '♫' : '♪';
    musicBtn.title = playing ? 'Pause our song' : 'Play our song';
    musicBtn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
  }

  musicBtn.addEventListener('click', function(){
    if (bgMusic.paused) {
      musicStatus.textContent = 'Starting music.';
      var playback = bgMusic.play();
      if (playback && typeof playback.then === 'function') {
        playback.then(function(){
          setMusicState(true);
          musicStatus.textContent = 'Music is playing.';
        }).catch(function(e) {
          console.warn('Music could not be played.', e);
          setMusicState(false);
          musicStatus.textContent = 'Music could not be played. Please try again.';
        });
      } else {
        setMusicState(true);
        musicStatus.textContent = 'Music is playing.';
      }
    } else {
      bgMusic.pause();
      setMusicState(false);
      musicStatus.textContent = 'Music paused.';
    }
  });

})();
</script>
</body>
</html>
